<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference Frame Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 12px; border: 1px solid #334155; }
    .round-tag { font-weight: 700; color: #38bdf8; font-size: 1.1rem; }
    .score-tag { font-weight: 600; color: #f59e0b; }
    .reset-btn { background: #334155; color: #f8fafc; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .reset-btn:hover { background: #475569; }
    .canvas-container { position: relative; width: 100%; height: 320px; background: #020617; border-radius: 12px; overflow: hidden; border: 2px solid #1e293b; }
    canvas { width: 100%; height: 100%; display: block; }
    .instruction-card { background: #1e293b; padding: 14px; border-radius: 10px; text-align: center; font-weight: 600; color: #f1f5f9; border: 1px solid #334155; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .control-group { background: #1e293b; padding: 12px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    .control-group label { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .btn-row { display: flex; gap: 6px; }
    .option-btn { flex: 1; padding: 10px 4px; background: #0f172a; border: 1px solid #334155; color: #94a3b8; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
    .option-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
    .action-btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .action-btn:hover { background: #1d4ed8; }
    .results-card { background: #1e293b; border-radius: 10px; padding: 16px; border: 1px solid #334155; display: none; flex-direction: column; gap: 12px; }
    .results-card.visible { display: flex; }
    .status-badge { font-size: 1.1rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; text-align: center; }
    .status-badge.correct { background: #065f46; color: #34d399; }
    .status-badge.incorrect { background: #881337; color: #f87171; }
    .speed-hint-box { font-size: 0.92rem; color: #fbbf24; background: #27272a; border-left: 4px solid #f59e0b; padding: 10px 12px; border-radius: 4px; line-height: 1.4; display: none; }
    .valid-list-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .valid-list-title { font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
    .valid-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
    .valid-item { display: flex; align-items: center; gap: 6px; }
    .valid-item.user-selected { color: #38bdf8; font-weight: 700; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <span class="round-tag" id="roundDisplay">Round 1 / 9</span>
    <span class="score-tag" id="scoreDisplay">Score: 0</span>
    <button class="reset-btn" id="resetBtn">🔄 Reset</button>
  </header>
  <div class="canvas-container">
    <canvas id="simCanvas"></canvas>
  </div>
  <div class="instruction-card">
    🎯 Select a correct combination of reference frames to match the ball bouncing shown
  </div>
  <div class="controls-grid" id="controlsGrid">
    <div class="control-group">
      <label>Person Motion</label>
      <div class="btn-row">
        <button class="option-btn" data-type="person" data-val="-1">Left ⬅️</button>
        <button class="option-btn active" data-type="person" data-val="0">Still 🛑</button>
        <button class="option-btn" data-type="person" data-val="1">Right ➡️</button>
      </div>
    </div>
    <div class="control-group">
      <label>Floor Motion</label>
      <div class="btn-row">
        <button class="option-btn" data-type="floor" data-val="-1">Left ⬅️</button>
        <button class="option-btn active" data-type="floor" data-val="0">Still 🛑</button>
        <button class="option-btn" data-type="floor" data-val="1">Right ➡️</button>
      </div>
    </div>
  </div>
  <button class="action-btn" id="actionBtn">Check Prediction 💡</button>
  <div class="results-card" id="resultsCard">
    <div class="status-badge" id="statusBadge"></div>
    <div class="speed-hint-box" id="speedHintBox"></div>
    <div class="valid-list-box">
      <div class="valid-list-title">All Valid Combinations For This Trajectory:</div>
      <ul class="valid-list" id="validList"></ul>
    </div>
  </div>
</div>
<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  let currentRound = 1, score = 0, state = 'GUESSING', roundSequence = [];
  let currentScenario = { person: 1, floor: 0 }, userPerson = 0, userFloor = 0;
  let ballX = 0, ballY = 0, ballVy = 4;
  const gravity = 0.25, floorY = 260;
  let trail = [], speedParticles = [];

  function initScenarios() {
    const allScenarios = [];
    for (let p of [-1, 0, 1]) {
      for (let f of [-1, 0, 1]) {
        allScenarios.push({ person: p, floor: f });
      }
    }
    const fixedR1 = { person: 1, floor: 0 };
    const remaining = allScenarios.filter(s => !(s.person === fixedR1.person && s.floor === fixedR1.floor));
    for (let i = remaining.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
    }
    roundSequence = [fixedR1, ...remaining];
  }

  function setupCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', setupCanvas);
  setupCanvas();

  function loadRound(r) {
    currentRound = r;
    state = 'GUESSING';
    currentScenario = roundSequence[r - 1];
    ballX = canvas.width / 2; ballY = 100; ballVy = 2; trail = []; speedParticles = [];
    document.getElementById('roundDisplay').textContent = `Round ${currentRound} / 9`;
    document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
    document.getElementById('actionBtn').textContent = "Check Prediction 💡";
    document.getElementById('resultsCard').classList.remove('visible');
    document.getElementById('speedHintBox').style.display = 'none';
    document.getElementById('controlsGrid').style.opacity = '1';
    document.getElementById('controlsGrid').style.pointerEvents = 'auto';
  }

  function getValidCombinations(targetNet) {
    const valid = [];
    for (let p of [-1, 0, 1]) {
      for (let f of [-1, 0, 1]) {
        if (p + f === targetNet) valid.push({ person: p, floor: f });
      }
    }
    return valid;
  }

  function formatCombo(c) {
    const pStr = c.person === -1 ? 'Left ⬅️' : c.person === 1 ? 'Right ➡️' : 'Still 🛑';
    const fStr = c.floor === -1 ? 'Left ⬅️' : c.floor === 1 ? 'Right ➡️' : 'Still 🛑';
    return `Person = ${pStr} | Floor = ${fStr}`;
  }

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const type = e.target.dataset.type, val = parseInt(e.target.dataset.val);
      document.querySelectorAll(`.option-btn[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      if (type === 'person') userPerson = val;
      if (type === 'floor') userFloor = val;
    });
  });

  document.getElementById('actionBtn').addEventListener('click', () => {
    if (state === 'GUESSING') {
      state = 'REVEALED';
      const targetNet = currentScenario.person + currentScenario.floor;
      const userNet = userPerson + userFloor;
      const isCorrect = targetNet === userNet;
      if (isCorrect) score++;
      document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
      const badge = document.getElementById('statusBadge');
      const speedHint = document.getElementById('speedHintBox');

      if (isCorrect) {
        badge.className = "status-badge correct";
        badge.textContent = "✅ CORRECT! (Equivalent Motion)";
        speedHint.style.display = 'none';
      } else {
        badge.className = "status-badge incorrect";
        badge.textContent = "❌ INCORRECT";
        if (targetNet !== 0 && Math.sign(targetNet) === Math.sign(userNet)) {
          if (Math.abs(targetNet) > Math.abs(userNet)) {
            speedHint.textContent = "💡 Hint: You got the direction right! But notice the ball is moving FASTER than what you picked (both frames are moving together).";
          } else {
            speedHint.textContent = "💡 Hint: You got the direction right! But notice the ball is moving SLOWER than what you picked (only one frame is moving).";
          }
          speedHint.style.display = 'block';
        } else if (targetNet === 0 && userNet !== 0) {
          speedHint.textContent = "💡 Hint: The ball is bouncing straight up and down! Look for a setup where the two motions cancel each other out.";
          speedHint.style.display = 'block';
        } else {
          speedHint.textContent = "💡 Hint: Check the direction! The ball is moving the opposite way.";
          speedHint.style.display = 'block';
        }
      }

      const validListEl = document.getElementById('validList');
      validListEl.innerHTML = '';
      getValidCombinations(targetNet).forEach(c => {
        const li = document.createElement('li');
        const isUserChoice = (c.person === userPerson && c.floor === userFloor);
        li.className = `valid-item ${isUserChoice ? 'user-selected' : ''}`;
        li.textContent = `• ${formatCombo(c)} ${isUserChoice ? ' (Your Choice)' : ''}`;
        validListEl.appendChild(li);
      });

      document.getElementById('resultsCard').classList.add('visible');
      document.getElementById('controlsGrid').style.opacity = '0.5';
      document.getElementById('controlsGrid').style.pointerEvents = 'none';
      document.getElementById('actionBtn').textContent = currentRound < 9 ? "Next Round ➡️" : "Restart Game 🔄";
    } else {
      if (currentRound < 9) loadRound(currentRound + 1);
      else { score = 0; initScenarios(); loadRound(1); }
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    score = 0; initScenarios(); loadRound(1);
  });

  function animate() {
    const netSpeed = currentScenario.person + currentScenario.floor;
    const speedMagnitude = Math.abs(netSpeed);
    ballX += netSpeed * 1.6;
    if (ballX > canvas.width + 20) ballX = -20;
    if (ballX < -20) ballX = canvas.width + 20;
    ballVy += gravity; ballY += ballVy;
    if (ballY >= floorY - 12) { ballY = floorY - 12; ballVy = -8.5; }

    const maxTrailLength = speedMagnitude === 2 ? 40 : speedMagnitude === 1 ? 20 : 8;
    trail.push({ x: ballX, y: ballY });
    if (trail.length > maxTrailLength) trail.shift();

    if (speedMagnitude === 2 && Math.random() < 0.3) {
      speedParticles.push({
        x: ballX - (netSpeed * 15),
        y: ballY + (Math.random() * 20 - 10),
        length: 25, alpha: 0.8
      });
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = speedParticles.length - 1; i >= 0; i--) {
      const p = speedParticles[i];
      ctx.strokeStyle = `rgba(56, 189, 248, ${p.alpha})`;
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - (netSpeed * p.length), p.y); ctx.stroke();
      p.alpha -= 0.04; if (p.alpha <= 0) speedParticles.splice(i, 1);
    }

    if (state === 'REVEALED') {
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 4; ctx.beginPath();
      ctx.moveTo(0, floorY); ctx.lineTo(canvas.width, floorY); ctx.stroke();
      const pX = ballX;
      ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.arc(pX, floorY - 40, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pX, floorY - 30); ctx.lineTo(pX, floorY - 15);
      ctx.moveTo(pX, floorY - 25); ctx.lineTo(pX - 10, floorY - 15);
      ctx.moveTo(pX, floorY - 25); ctx.lineTo(pX + 10, floorY - 15);
      ctx.moveTo(pX, floorY - 15); ctx.lineTo(pX - 8, floorY);
      ctx.moveTo(pX, floorY - 15); ctx.lineTo(pX + 8, floorY); ctx.stroke();
    } else {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
    }

    const trailColor = speedMagnitude === 2 ? 'rgba(56, 189, 248, 0.7)' : 'rgba(245, 158, 11, 0.4)';
    ctx.strokeStyle = trailColor; ctx.lineWidth = speedMagnitude === 2 ? 3 : 2; ctx.beginPath();
    for (let i = 0; i < trail.length; i++) {
      if (i === 0) ctx.moveTo(trail[i].x, trail[i].y);
      else ctx.lineTo(trail[i].x, trail[i].y);
    }
    ctx.stroke();

    ctx.fillStyle = speedMagnitude === 2 ? '#38bdf8' : '#f59e0b';
    ctx.beginPath(); ctx.arc(ballX, ballY, 12, 0, Math.PI * 2); ctx.fill();
    requestAnimationFrame(animate);
  }

  initScenarios(); loadRound(1); requestAnimationFrame(animate);
</script>
</body>
</html>
